# Dataset.ET 12-layer + train-time multi-condition augmentation.
# Same encoder as 20m_char_12layer; warm-start from its best.pt.
# Judge against that run's 29.0 greedy dev WER — architecture is unchanged.
#
#   python -m data.prepare_aug_assets
#   python train.py --config configs/20m_char_12layer_aug.yaml
#
# Noise/RIR dirs may be empty: WaveformAugment then synthesises pink noise
# and exponential RIRs. Replace with MUSAN / OpenSLR RIR when you have them.

experiment: 20m_char_12layer_aug
seed: 42
sample_rate: 16000

model:
  name: conformer_ctc
  d_model: 256
  num_layers: 12
  num_heads: 4
  ffn_dim: 1024
  conv_kernel_size: 31
  dropout: 0.1
  input_dim: 80

tokenizer:
  type: char

train:
  epochs: 80
  lr: 3.0e-4
  min_lr: 1.0e-5
  warmup_steps: 1000
  cmvn: true
  inter_ctc_weight: 0.3
  weight_decay: 0.01
  grad_clip: 5.0
  grad_accum: 1
  precision: bf16
  batch_seconds: 80
  eval_batch_size: 16
  num_workers: 4
  prefetch_factor: 4
  specaug: true
  specaug_start_epoch: 1
  speed_perturb: [0.9, 1.0, 1.1]
  trim_silence: false
  early_stopping_patience: 12
  augment:
    gain_db: [-35, -15]
    noise_prob: 0.5
    noise_snr_db: [5, 20]
    noise_dir: data/noise
    rir_prob: 0.3
    rir_dir: data/rir
    codec_prob: 0.2
    codec: phone
    synthetic_if_empty: true

paths:
  metadata_dir: metadata
  exp_dir: exp/20m_char_12layer_aug
  init_from: exp/20m_char_12layer/best.pt
