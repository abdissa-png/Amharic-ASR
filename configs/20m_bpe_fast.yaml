# Fast Conformer front-end on the 20 M unigram recipe.
# 8× depthwise-separable subsample + conv kernel 9 (Rekesh et al. 2023).
# Must stay on subwords: 8× + characters violates CTC T >= U.
#
#   python train.py --config configs/20m_bpe_fast.yaml

experiment: 20m_bpe_fast
seed: 42
sample_rate: 16000

model:
  name: conformer_ctc
  d_model: 256
  num_layers: 12
  num_heads: 4
  ffn_dim: 1024
  conv_kernel_size: 9
  dropout: 0.1
  input_dim: 80
  subsample_factor: 8
  subsample: dw_striding

tokenizer:
  type: unigram
  vocab_size: 1024

train:
  epochs: 40
  lr: 1.0e-4
  min_lr: 1.0e-6
  warmup_steps: 2000
  weight_decay: 0.01
  grad_clip: 5.0
  grad_accum: 1
  precision: bf16
  batch_seconds: 80
  eval_batch_size: 8
  num_workers: 4
  specaug: true
  speed_perturb: [0.9, 1.0, 1.1]
  trim_silence: false
  early_stopping_patience: 8

paths:
  metadata_dir: metadata
  exp_dir: exp/20m_bpe_fast
