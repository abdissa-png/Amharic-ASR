experiment: 50m_phoneme
seed: 42
sample_rate: 16000

model:
  name: conformer_ctc
  d_model: 384
  num_layers: 12
  num_heads: 6
  ffn_dim: 1536
  conv_kernel_size: 31
  dropout: 0.1
  input_dim: 80

tokenizer:
  type: phoneme

train:
  epochs: 40
  lr: 1.0e-4
  min_lr: 1.0e-6
  warmup_steps: 2000
  weight_decay: 0.01
  grad_clip: 5.0
  grad_accum: 1
  precision: bf16
  batch_seconds: 60
  eval_batch_size: 4
  num_workers: 4
  specaug: true
  speed_perturb: [0.9, 1.0, 1.1]
  trim_silence: false
  early_stopping_patience: 8

paths:
  metadata_dir: metadata
  exp_dir: exp/50m_phoneme
