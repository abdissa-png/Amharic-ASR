# Pooled 12-layer: Dataset.ET + FLEURS-train + ALFFA + BDU + Leyu,
# relative attention + kernels 9/15/31, multi-condition augmentation.
# Early-stop on Dataset.ET dev (prepare_pool --dev-policy et) so WER stays
# comparable to 28.75 / 29.0. Score other corpora with evaluate.py --jsonl,
# dialects with evaluation.robustness --by region.
#
# Encoder matches 20m_char_relpos_multiconv. init-from copies the plain
# 12-layer MHA into relpos qkv/out and centre-crops the 31-tap conv into
# the 9 and 15 branches. pos_proj / u / v stay at init.
#
# Schedule assumes the full pool is on disk (~500 h train after Leyu's
# prompt holdout). At batch_seconds 80 that is ~23k steps/epoch.
# The old 80-epoch / 3e-4 / 1000-step warmup was the 42 h fine-tune:
# warmup died in the first twentieth of an epoch, and cosine never
# reached min_lr before early stopping. 16 epochs is ~370k steps.
# Warmup is ~8k steps (about a third of the first epoch) so the new
# relative tensors and the augmented batches are not at peak lr immediately.
# Peak 5e-4 is half the from-scratch 1e-3; 3e-4 was only to protect a
# model that was already fit to the same 42 h. Weight decay stays 0.01 —
# gain/noise/RIR/codec is the regularizer.
#
# If Leyu is missing, the pool is ~100 h (~5k steps/epoch). Cut
# warmup_steps to 2000 before launching, or the first two epochs are
# still warming up.
#
#   python prepare_dataset.py
#   python -m data.prepare_fleurs --splits train validation test
#   python -m data.prepare_alffa
#   python -m data.prepare_bdu
#   python -m data.prepare_leyu
#   python -m data.prepare_aug_assets
#   python -m data.prepare_pool
#   python train.py --config configs/20m_char_12layer_pool.yaml

experiment: 20m_char_12layer_pool
seed: 42
sample_rate: 16000

model:
  name: conformer_ctc
  d_model: 256
  num_layers: 12
  num_heads: 4
  ffn_dim: 1024
  conv_kernel_size: [9, 15, 31]
  dropout: 0.1
  input_dim: 80
  pos_encoding: rel

tokenizer:
  type: char

train:
  epochs: 16
  lr: 5.0e-4
  min_lr: 1.0e-5
  warmup_steps: 8000
  cmvn: true
  inter_ctc_weight: 0.3
  weight_decay: 0.01
  grad_clip: 5.0
  grad_accum: 1
  precision: bf16
  batch_seconds: 80
  eval_batch_size: 16
  num_workers: 4
  prefetch_factor: 4
  specaug: true
  specaug_start_epoch: 1
  speed_perturb: [0.9, 1.0, 1.1]
  trim_silence: false
  # Leyu clips run to ~80 s. The loader default of 30 s would keep the full
  # transcript against a chopped prefix.
  max_duration: 90
  early_stopping_patience: 5
  augment:
    gain_db: [-35, -15]
    noise_prob: 0.5
    noise_snr_db: [5, 20]
    noise_dir: data/noise
    rir_prob: 0.3
    rir_dir: data/rir
    codec_prob: 0.2
    codec: phone
    synthetic_if_empty: true

paths:
  metadata_dir: metadata/pool
  exp_dir: exp/20m_char_12layer_pool
  init_from: exp/20m_char_12layer/best.pt
