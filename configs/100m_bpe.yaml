experiment: 100m_bpe
seed: 42
sample_rate: 16000

model:
  name: conformer_ctc
  d_model: 512
  num_layers: 14
  num_heads: 8
  ffn_dim: 2048
  conv_kernel_size: 31
  dropout: 0.1
  input_dim: 80

tokenizer:
  type: unigram
  vocab_size: 1024

train:
  epochs: 40
  lr: 8.0e-5
  min_lr: 1.0e-6
  warmup_steps: 2000
  weight_decay: 0.01
  grad_clip: 5.0
  grad_accum: 2
  precision: bf16
  batch_seconds: 40
  eval_batch_size: 2
  num_workers: 4
  specaug: true
  speed_perturb: [0.9, 1.0, 1.1]
  trim_silence: false
  early_stopping_patience: 8

paths:
  metadata_dir: metadata
  exp_dir: exp/100m_bpe
