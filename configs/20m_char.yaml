experiment: 20m_char
seed: 42
sample_rate: 16000

model:
  name: conformer_ctc
  d_model: 256
  num_layers: 12
  num_heads: 4
  ffn_dim: 1024
  conv_kernel_size: 31
  dropout: 0.1
  input_dim: 80

tokenizer:
  type: char

train:
  epochs: 40
  lr: 1.0e-3
  min_lr: 1.0e-5
  warmup_steps: 400
  cmvn: true
  weight_decay: 0.01
  grad_clip: 5.0
  grad_accum: 1
  precision: bf16
  batch_seconds: 80
  eval_batch_size: 8
  num_workers: 4
  specaug: true
  specaug_start_epoch: 6
  inter_ctc_weight: 0.5
  speed_perturb: [0.9, 1.0, 1.1]
  trim_silence: false
  early_stopping_patience: 8

paths:
  metadata_dir: metadata
  exp_dir: exp/20m_char
