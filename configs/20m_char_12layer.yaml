# Phase 3: Scale up to 12 layers (20M params) with char tokenizer.
# Initialise from the 4-layer best checkpoint — layers 1-4 transfer,
# layers 5-12 start random:
#
#   python train.py --config configs/20m_char_12layer.yaml \
#       --init-from exp/20m_char_4layer/best.pt
#
# 100 epochs instead of 60: the 4-layer experiment showed that ~30 epochs
# are spent crossing the alignment barrier, leaving the cosine LR almost
# exhausted by the time the model starts learning.  100 epochs keeps the
# LR at 75% of peak when useful learning begins (~epoch 34) and gives
# layers 5-12 enough high-LR budget to converge.

experiment: 20m_char_12layer
seed: 42
sample_rate: 16000

model:
  name: conformer_ctc
  d_model: 256
  num_layers: 12
  num_heads: 4
  ffn_dim: 1024
  conv_kernel_size: 31
  dropout: 0.1
  input_dim: 80

tokenizer:
  type: char

train:
  epochs: 100
  lr: 1.0e-3
  min_lr: 1.0e-5
  warmup_steps: 1000
  cmvn: true
  inter_ctc_weight: 0.3
  weight_decay: 0.01
  grad_clip: 5.0
  grad_accum: 1
  precision: bf16
  batch_seconds: 80
  eval_batch_size: 16
  num_workers: 4
  prefetch_factor: 4
  specaug: true
  specaug_start_epoch: 3
  speed_perturb: [0.9, 1.0, 1.1]
  trim_silence: false
  early_stopping_patience: 15

paths:
  metadata_dir: metadata
  exp_dir: exp/20m_char_12layer
