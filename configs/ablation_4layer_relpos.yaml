# Screen: Transformer-XL relative attention vs the 4-layer abs-PE baseline.
# Hypothesis: long Amharic words and vowel harmony benefit from relative offsets;
# chapter 7 already named this the first encoder swap.
#
#   python train.py --config configs/ablation_4layer_relpos.yaml \
#       --init-from exp/20m_char_4layer/best.pt
#
# FFN / conv / subsample load; attention is new.

experiment: ablation_4layer_relpos
seed: 42
sample_rate: 16000

model:
  name: conformer_ctc
  d_model: 256
  num_layers: 4
  num_heads: 4
  ffn_dim: 1024
  conv_kernel_size: 31
  dropout: 0.1
  input_dim: 80
  pos_encoding: rel

tokenizer:
  type: char

train:
  epochs: 60
  lr: 1.0e-3
  min_lr: 1.0e-5
  warmup_steps: 500
  cmvn: true
  inter_ctc_weight: 0.0
  weight_decay: 0.01
  grad_clip: 5.0
  grad_accum: 1
  precision: bf16
  batch_seconds: 80
  eval_batch_size: 24
  num_workers: 8
  prefetch_factor: 4
  specaug: true
  specaug_start_epoch: 5
  speed_perturb: [0.9, 1.0, 1.1]
  trim_silence: false
  early_stopping_patience: 10

paths:
  metadata_dir: metadata
  exp_dir: exp/ablation_4layer_relpos
