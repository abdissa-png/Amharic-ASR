# Screen: parallel depthwise kernels 9 / 15 / 31 (Multi-Convformer, not MFA).
# Hypothesis: multiple phonetic timescales beat a single 1.24 s kernel, at
# almost no extra parameters (depthwise cost is d·k).
#
#   python train.py --config configs/ablation_4layer_multiconv.yaml

experiment: ablation_4layer_multiconv
seed: 42
sample_rate: 16000

model:
  name: conformer_ctc
  d_model: 256
  num_layers: 4
  num_heads: 4
  ffn_dim: 1024
  conv_kernel_size: [9, 15, 31]
  dropout: 0.1
  input_dim: 80

tokenizer:
  type: char

train:
  epochs: 60
  lr: 1.0e-3
  min_lr: 1.0e-5
  warmup_steps: 500
  cmvn: true
  inter_ctc_weight: 0.0
  weight_decay: 0.01
  grad_clip: 5.0
  grad_accum: 1
  precision: bf16
  batch_seconds: 80
  eval_batch_size: 24
  num_workers: 8
  prefetch_factor: 4
  specaug: true
  specaug_start_epoch: 5
  speed_perturb: [0.9, 1.0, 1.1]
  trim_silence: false
  early_stopping_patience: 10

paths:
  metadata_dir: metadata
  exp_dir: exp/ablation_4layer_multiconv
